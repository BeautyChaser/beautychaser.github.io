name: Publish collected platform updates

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'config/news-*.json'
      - 'scripts/*news*'
      - 'src/data/news-core.js'
      - '.github/workflows/sync-news.yml'

permissions:
  contents: write
  pages: write

concurrency:
  group: sync-public-news
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Collect confirmed links and available public feeds
        run: npm run news:sync
        env:
          RSSHUB_BASE_URL: ${{ vars.RSSHUB_BASE_URL }}
      - run: npm run build && npm run check
      - name: Save snapshots and compiled output
        id: commit
        shell: bash
        run: |
          git add -- public/news-feed.json news-feed.json index.html assets .pages-manifest.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update public platform news snapshot"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"
      # GITHUB_TOKEN commits do not trigger a branch-based Pages build by themselves.
      # The site also reads the public raw snapshot, so new entries remain available
      # if a Pages rebuild is delayed or the API request is unavailable.
      - name: Request a branch-based Pages build
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          if ! gh api --method POST "repos/$GH_REPO/pages/builds" --silent; then
            echo "::warning::Pages rebuild request unavailable. The public raw news snapshot is already updated."
          fi
