<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >
  <title>赵峰的个人主页</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        "Microsoft YaHei",
        "Segoe UI",
        sans-serif;
      background: #f5f7fa;
      color: #1f2937;
    }

    .container {
      width: min(900px, 90%);
      margin: 80px auto;
    }

    .card {
      padding: 48px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin-top: 0;
      font-size: 42px;
    }

    .subtitle {
      color: #4b5563;
      font-size: 18px;
      line-height: 1.8;
    }

    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 32px;
    }

    .links a {
      padding: 10px 18px;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      text-decoration: none;
    }

    .links a:hover {
      background: #1d4ed8;
    }
  </style>
</head>

<body>
  <main class="container">
    <section class="card">
      <h1>你好，我是赵峰</h1>

      <p class="subtitle">
        我主要关注科学计算、有限元、多物理场仿真、
        C++ 工程、MOOSE、libMesh、COMSOL、
        电池模型以及 AI Agent 人机协同。
      </p>

      <div class="links">
        <a href="https://github.com/你的用户名">
          GitHub
        </a>

        <a href="#projects">
          项目经历
        </a>

        <a href="#articles">
          技术文章
        </a>
      </div>
    </section>
  </main>
</body>
</html>
